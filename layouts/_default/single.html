{{ define "main" }}
<article>
    <div class="content">
            {{ .Content }}
        </div>

    <footer class="post-footer">
        <a href="{{ .RelPermalink }}" class="meta-link">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
        </a>
    </footer>
</article>
{{ end }}
